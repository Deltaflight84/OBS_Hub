<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarica la mia App</title>
    <style>
        /* Design Dark Mode Consolidato */
        body {
            background-color: #0f111a; /* Sfondo scuro profondo */
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background-color: #1a1d29; /* Sfondo card leggermente più chiaro */
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
            border: 1px solid #2d3245;
        }

        h1 { color: #ffffff; font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: #a0a6b5; line-height: 1.5; margin-bottom: 2rem; }

        /* Bottoni */
        .btn {
            display: block;
            padding: 15px 25px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, filter 0.2s;
        }

        .btn:active { transform: scale(0.98); }

        .btn-download {
            background-color: #007bff;
            color: white;
            font-size: 1.1rem;
        }

        .btn-kofi {
            background-color: #ff5e5b; /* Colore Ko-fi */
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover { filter: brightness(1.2); }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #4b5263;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 La mia App</h1>
    <p>Scarica l'ultima versione ufficiale. Se il mio progetto ti piace, puoi supportarmi offrendomi un caffè!</p>

        ⬇️ Scarica Ora
    </a>

    <a href="https://ko-fi.com/roxfod" class="btn btn-kofi" target="_blank">
        ☕ Supportami su Ko-fi
    </a>

    <div class="footer">
        © 2026 • Progetto Indipendente
    </div>
</div>

</body>
</html>
